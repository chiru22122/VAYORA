<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — VAYORA</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/animations.css">
  <style>
    .auth-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--grad-primary);
    }
  </style>
</head>
<body>

  <div class="auth-page-wrap">
    <div class="auth-card animate-entrance">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-family: var(--font-display); font-size: 1.4rem; color: var(--text-primary);">Account Recovery</h1>
        <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 4px;">Reset your account security credentials</p>
      </div>

      <!-- Step 1: Request OTP -->
      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="forgot-email">Account Email</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="sender@vayora.demo" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          Send Recovery Code
        </button>
      </form>

      <!-- Step 2: Reset Form -->
      <form id="reset-form" style="display: none;">
        <div id="forgot-code-notice" style="background: var(--bg-secondary); border: 1px solid var(--border-medium); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.85rem; color: var(--neon-emerald); font-weight: 700; margin-bottom: 18px;">
          Checking code...
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-otp">Recovery OTP Code</label>
          <input type="text" id="reset-otp" class="form-control" placeholder="6-digit code" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-new-pass">New Password</label>
          <input type="password" id="reset-new-pass" class="form-control" placeholder="Minimum 6 characters" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          Update Password & Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px;">
        <a href="/login.html" style="font-size: 0.82rem; color: var(--text-secondary); text-decoration: none;">← Back to Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
