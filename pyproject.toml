[project]
name = "vayora"
version = "1.0.0"
description = "VAYORA Unified Digital Asset and Payment Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.4",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "psycopg[binary]>=3.1.18",
    "websockets>=12.0"
]

[tool.vercel]
entrypoint = "backend.main:app"

